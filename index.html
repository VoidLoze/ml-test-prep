<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI тест">
<meta name="theme-color" content="#4f46e5">
<title>ИИ / ML — подготовка к контрольной</title>
<style>
:root {
  --bg: #f4f5f8;
  --card: #ffffff;
  --text: #1b1d24;
  --muted: #6b7080;
  --line: #e2e4ea;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --ok: #1f9d55;
  --ok-soft: #e3f6ea;
  --bad: #d64545;
  --bad-soft: #fde8e8;
  --code-bg: #f6f8fa;
  --code-text: #24292f;
  --t-k: #cf222e;
  --t-s: #0a3069;
  --t-n: #0550ae;
  --t-c: #6e7781;
  --t-b: #8250df;
  --mark: #fff1a8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318;
    --card: #1b1e26;
    --text: #e8eaf0;
    --muted: #9aa0b2;
    --line: #2c303b;
    --accent: #7c9bff;
    --accent-soft: #232b45;
    --ok: #4cc97a;
    --ok-soft: #173023;
    --bad: #ff7676;
    --bad-soft: #3a1d1f;
    --code-bg: #0f1116;
    --code-text: #d8dee9;
    --t-k: #ff7b72;
    --t-s: #a5d6ff;
    --t-n: #79c0ff;
    --t-c: #8b949e;
    --t-b: #d2a8ff;
    --mark: #5a4a00;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 12px 12px 96px; }
h1 { font-size: 22px; margin: 6px 0 4px; }
h2 { font-size: 18px; margin: 18px 0 8px; }
h3 { font-size: 16px; margin: 14px 0 6px; }
.muted { color: var(--muted); font-size: 14px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  margin: 10px 0;
}
.btn {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 13px 14px;
  font-size: 16px;
  font-weight: 600;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  text-align: center;
}
.btn.secondary { background: var(--accent-soft); color: var(--accent); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.stats b { display: block; font-size: 20px; }
.stats span { font-size: 12px; color: var(--muted); }
.topic {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 2px; border-bottom: 1px solid var(--line);
}
.topic:last-child { border-bottom: 0; }
.topic input { width: 20px; height: 20px; flex: none; }
.topic .tname { flex: 1; font-size: 15px; }
.topic .tcount { font-size: 12px; color: var(--muted); white-space: nowrap; }
.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--ok); }
.toggle { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 15px; }
.toggle input { width: 20px; height: 20px; }

.qtop { display: flex; align-items: center; gap: 8px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 5; }
.qtop .back { flex: none; width: auto; padding: 8px 12px; font-size: 14px; }
.qtop .prog { flex: 1; font-size: 13px; color: var(--muted); text-align: right; }
.pbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tag { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tag.code { background: #fff3d6; color: #8a5a00; }
@media (prefers-color-scheme: dark) { .tag.code { background: #3a2e12; color: #f2c66d; } }
.qtext { font-size: 17px; font-weight: 600; margin: 4px 0 10px; }
.qtext code, .opt code, .md code, .fb code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.9em;
  background: var(--code-bg);
  padding: 1px 5px;
  border-radius: 5px;
}
pre.code {
  background: var(--code-bg);
  color: var(--code-text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13.5px;
  line-height: 1.55;
  padding: 12px;
  border-radius: 10px;
  overflow-x: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 8px 0;
  border: 1px solid var(--line);
}
@media (max-width: 420px) {
  pre.code { font-size: 12.5px; padding: 10px; }
}
.t-k { color: var(--t-k); }
.t-s { color: var(--t-s); }
.t-n { color: var(--t-n); }
.t-c { color: var(--t-c); font-style: italic; }
.t-b { color: var(--t-b); }
pre.code mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; font-weight: 700; }
input.blank {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 16px;
  padding: 2px 4px;
  margin: 1px 0;
  border: 1.5px dashed var(--accent);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  min-width: 5ch;
  vertical-align: baseline;
}
input.blank.ok { border: 1.5px solid var(--ok); background: var(--ok-soft); }
input.blank.bad { border: 1.5px solid var(--bad); background: var(--bad-soft); }
input.num {
  width: 100%; font-size: 18px; padding: 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--card); color: var(--text);
}
input.num.ok { border-color: var(--ok); background: var(--ok-soft); }
input.num.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt {
  display: block; width: 100%; text-align: left;
  border: 1.5px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 12px; padding: 12px; margin: 8px 0; font-size: 15.5px; cursor: pointer;
}
.opt .mk { display: inline-block; width: 22px; font-weight: 700; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.miss { border-color: var(--ok); border-style: dashed; }
.opt:disabled { cursor: default; color: var(--text); opacity: 1; }
.fb { border-radius: 12px; padding: 12px; margin-top: 12px; }
.fb.ok { background: var(--ok-soft); border: 1px solid var(--ok); }
.fb.bad { background: var(--bad-soft); border: 1px solid var(--bad); }
.fb .verdict { font-weight: 700; font-size: 17px; margin-bottom: 6px; }
.fb .ans { margin: 6px 0; }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md h3 { margin: 12px 0 4px; }
.hint { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
.actions {
  position: fixed; left: 0; right: 0; bottom: 56px;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
  padding: 10px 12px 8px; z-index: 6;
}
.actions .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
.actions .inner .btn { flex: 1; }
.actions .inner .btn.small { flex: 0 0 auto; width: auto; padding: 13px 14px; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; height: 56px;
  background: var(--card); border-top: 1px solid var(--line);
  display: flex; z-index: 7; padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button {
  flex: 1; border: 0; background: transparent; color: var(--muted);
  font-size: 13px; font-weight: 600; cursor: pointer;
}
nav.tabs button.on { color: var(--accent); }
nav.tabs button span { display: block; font-size: 20px; line-height: 1.1; }
details.sec { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; }
details.sec > summary { padding: 14px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: "＋"; color: var(--muted); flex: none; }
details.sec[open] > summary::after { content: "－"; }
details.sec .md { padding: 0 14px 14px; }
.reslist a { color: var(--accent); text-decoration: none; }
.reslist li { margin: 6px 0; }
.big { font-size: 40px; font-weight: 800; text-align: center; margin: 8px 0; }
.search { width: 100%; font-size: 16px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }

</style>
</head>
<body>
<div id="app"></div>
<script>
window.TOPICS = [{"key": "ml", "icon": "🧠", "name": "Основы ML: определения и типы систем"}, {"key": "iris", "icon": "🌸", "name": "Первая модель: Iris, kNN, оценка"}, {"key": "fit", "icon": "⚖️", "name": "Проблемы ML: данные, overfitting, валидация"}, {"key": "project", "icon": "🗺️", "name": "Проект ML: шаги, метрики, данные"}, {"key": "explore", "icon": "🏠", "name": "Housing: обзор, split, корреляции"}, {"key": "clean", "icon": "🧹", "name": "Пропуски и очистка (Imputer, Titanic)"}, {"key": "encode", "icon": "🔤", "name": "Категории: Ordinal / One-Hot"}, {"key": "scale", "icon": "📏", "name": "Масштабирование, log, RBF, target"}, {"key": "custom", "icon": "🛠️", "name": "Свои трансформеры и классы"}, {"key": "pandas", "icon": "🐼", "name": "pandas: Chipotle, фильтры, groupby"}, {"key": "viz", "icon": "📊", "name": "Графики: seaborn и matplotlib"}, {"key": "models", "icon": "🤖", "name": "Модели, Pipeline, ColumnTransformer"}, {"key": "md", "icon": "📝", "name": "Markdown в Jupyter"}];
window.QUESTIONS = [{"id": "ml-01", "topic": "ml", "q": "According to Tom Mitchell's definition, what is the experience **E** for a spam filter?", "exp": "Определение Митчелла: программа учится на опыте **E** решать задачу **T**, если качество **P** растёт с опытом.\n- **T** (task) — помечать новые письма как спам.\n- **E** (experience) — обучающие данные, то есть письма с метками spam/ham.\n- **P** (performance) — например, accuracy, доля правильно классифицированных писем.\nЛовушка: «доля правильно классифицированных» — это P, а не E.", "options": ["The ratio of correctly classified emails", "Flagging spam for new emails", "The training data: emails already labeled as spam or ham", "The neural network that classifies emails"], "type": "mcq", "answer": 2}, {"id": "ml-02", "topic": "ml", "q": "In the spam filter example, the ratio of correctly classified emails is called accuracy. In Mitchell's terms it is:", "exp": "Accuracy — это мера качества **P**. На лекции прямо сказано, что accuracy часто используют в задачах **классификации**. Для регрессии (например, цены домов) берут другие метрики: RMSE, MAE.", "options": ["The performance measure P, often used in classification tasks", "The task T", "The experience E", "A hyperparameter of the model"], "type": "mcq", "answer": 0}, {"id": "ml-03", "topic": "ml", "q": "Spammers notice that emails containing \"4U\" are blocked and start writing \"For U\". Why does an ML-based spam filter handle this better than a traditional rule-based one?", "exp": "В традиционном подходе пришлось бы дописать новое правило под «For U», потом под следующий обход, и так бесконечно. ML-фильтр учится на письмах, которые пользователи помечают как спам: новая фраза становится частой в спаме, и модель сама начинает её ловить. Метки при этом нужны: это supervised learning.", "options": ["It has a built-in dictionary of synonyms", "It automatically notices that \"For U\" became unusually frequent in spam flagged by users and starts flagging it without new hand-written rules", "Rule-based filters cannot use keywords at all", "ML filters do not need any labeled examples"], "type": "mcq", "answer": 1}, {"id": "ml-04", "topic": "ml", "q": "According to the lecture, machine learning is great for which problems? (select all that apply)", "exp": "Четыре пункта со слайда «ML is great for»: длинные списки правил, сложные задачи без хорошего классического решения, меняющаяся среда и поиск закономерностей в больших данных. Если точная формула известна и не меняется, ML не нужен: достаточно обычной программы.", "options": ["Problems whose existing solutions need a lot of fine-tuning or long lists of rules", "Complex problems where a traditional approach yields no good solution", "Fluctuating environments", "Getting insights about complex problems and large amounts of data", "Problems where an exact formula is known and never changes"], "type": "multi", "answer": [0, 1, 2, 3]}, {"id": "ml-05", "topic": "ml", "q": "Detecting tumors in brain scans, where we must find the exact location and shape of each tumor, is an example of:", "exp": "Если нужно точное **место и форма**, классифицируется каждый **пиксель**: это semantic segmentation (обычно CNN или transformers). Image classification даёт один ответ на всю картинку, например «на конвейере брак / не брак».", "options": ["Image classification", "Semantic image segmentation, where each pixel is classified", "Clustering", "Anomaly detection"], "type": "mcq", "answer": 1}, {"id": "ml-06", "topic": "ml", "q": "Automatically flagging offensive comments on discussion forums is:", "exp": "Вход — текст, выход — класс (offensive / not). Это NLP, конкретно **text classification**. На лекции: можно RNN и CNN, но **transformers работают лучше**.", "options": ["Natural language processing (NLP), specifically text classification", "Speech recognition", "Semantic segmentation", "Regression"], "type": "mcq", "answer": 0}, {"id": "ml-07", "topic": "ml", "q": "Forecasting your company's revenue next year based on many performance metrics is:", "exp": "Предсказываем **число** (выручку) — значит regression. На слайде: любая регрессионная модель, например linear или polynomial regression.", "options": ["Classification", "Regression", "Clustering", "Association rule learning"], "type": "mcq", "answer": 1}, {"id": "ml-08", "topic": "ml", "q": "Segmenting clients based on their purchases so you can design a different marketing strategy for each segment is:", "exp": "Заранее меток сегментов нет, модель сама находит группы похожих клиентов. Это unsupervised **clustering** (k-means, DBSCAN). Классификация была бы, если бы сегменты уже были размечены и мы учились их предсказывать.", "options": ["Classification, because each client gets a segment label", "Clustering, for example k-means or DBSCAN", "Regression", "Reinforcement learning"], "type": "mcq", "answer": 1}, {"id": "ml-09", "topic": "ml", "q": "\"Customers who buy bread are also likely to buy butter, so place them close to each other.\" Which unsupervised task is this?", "exp": "Association rule learning ищет правила совместной встречаемости вида «если X, то часто и Y». Классический пример — market basket analysis (хлеб → масло).", "options": ["Association rule learning", "Anomaly detection", "Dimensionality reduction", "Hierarchical clustering"], "type": "mcq", "answer": 0}, {"id": "ml-10", "topic": "ml", "q": "A car's mileage is strongly correlated with its age, so an algorithm merges them into one feature. What is this called?", "exp": "Объединить несколько коррелированных признаков в один новый — **feature extraction**, это делают алгоритмы dimensionality reduction.\n- Feature selection — **выбрать** лучшие из уже существующих признаков, ничего не объединяя.\n- Regularization — ограничение модели против overfitting.", "options": ["Feature selection", "Feature extraction (dimensionality reduction)", "Regularization", "Bucketizing"], "type": "mcq", "answer": 1}, {"id": "ml-11", "topic": "ml", "q": "Which unsupervised task fits ALL of these: detecting fraudulent card transactions, catching manufacturing defects, removing outliers before feeding data to another algorithm?", "exp": "Anomaly detection моделирует «нормальное» поведение данных и помечает точки, которые сильно от него отличаются. Меток normal/abnormal обычно нет, поэтому это unsupervised.", "options": ["Association rule learning", "Anomaly detection", "Visualization", "Semi-supervised learning"], "type": "mcq", "answer": 1}, {"id": "ml-12", "topic": "ml", "q": "t-SNE or UMAP projecting word embeddings into 2D so that similar words appear near each other is an example of:", "exp": "Visualization algorithms проецируют сложные данные в 2D/3D и стараются сохранить структуру: похожие объекты рядом, разные кластеры не перекрываются. Меток нет, поэтому это unsupervised.", "options": ["Visualization algorithms", "Hierarchical clustering", "Reinforcement learning", "Regression"], "type": "mcq", "answer": 0}, {"id": "ml-13", "topic": "ml", "q": "An algorithm starts by treating each point as its own cluster, then merges the closest pairs step by step, forming a tree of groups. This is:", "exp": "Так работает hierarchical clustering: получается иерархия, как семейное дерево. Пример с лекции: посетители блога делятся на группы (подростки, любящие комиксы; взрослые, любящие sci-fi), а потом каждая группа делится ещё мельче.", "options": ["k-means clustering", "Hierarchical clustering", "Anomaly detection", "Self-supervised learning"], "type": "mcq", "answer": 1}, {"id": "ml-14", "topic": "ml", "q": "A hospital has a few X-rays labeled \"disease\"/\"healthy\" and thousands of unlabeled X-rays. Doctors don't have time to label them all. Which type of learning fits best?", "exp": "Немного размеченных + много неразмеченных = **semi-supervised**. Цель — сократить стоимость и время разметки. Обычно сочетают unsupervised и supervised методы.", "options": ["Supervised", "Unsupervised", "Semi-supervised", "Reinforcement"], "type": "mcq", "answer": 2}, {"id": "ml-15", "topic": "ml", "q": "How can clustering be used in semi-supervised learning, as shown in the lecture?", "exp": "Схема со слайда: кластеризуем всё, внутри кластера неразмеченным точкам ставим самую частую метку, после этого датасет размечен и подходит любой обычный supervised-алгоритм.", "options": ["Cluster similar instances, give unlabeled points the most frequent label within their cluster, then train a normal supervised model", "Replace all labels with cluster numbers and discard the original labels", "Use clustering only to remove outliers", "Train a reinforcement learning agent inside each cluster"], "type": "mcq", "answer": 0}, {"id": "ml-16", "topic": "ml", "q": "A language model hides the word \"mat\" in \"The cat sat on the ___\" and learns to predict it. Nobody labeled the data by hand. Which type of learning is this?", "exp": "Модель **сама создаёт метки** из данных: прячет слово, и оно становится target. Это self-supervised (pretext task).\nЛовушка: людей-разметчиков нет, но цель для предсказания **есть**, поэтому это не unsupervised. Так учатся языковые модели вроде ChatGPT; для картинок прячут часть изображения.", "options": ["Unsupervised learning, because there are no human labels", "Self-supervised learning", "Semi-supervised learning", "Reinforcement learning"], "type": "mcq", "answer": 1}, {"id": "ml-17", "topic": "ml", "q": "A robot learns to walk by getting rewards for successful steps and penalties for falling. What does it learn?", "exp": "Reinforcement learning: прямых правильных ответов нет, только rewards и penalties за действия. Цель — выучить **policy**, стратегию, которая максимизирует награду во времени. Примеры: игры, роботы, оптимизация доставки.", "options": ["Cluster centers", "A policy (strategy) that maximizes rewards over time", "A cost function", "Human-provided labels for each step"], "type": "mcq", "answer": 1}, {"id": "ml-18", "topic": "ml", "q": "A spam filter learns on the fly using a deep neural network trained on human-provided examples of spam and ham. How is it described in the lecture?", "exp": "- «Learns on the fly» — **online**.\n- Нейросеть строит модель — **model-based**.\n- Примеры размечены людьми — **supervised**.\nЭто дословный пример со слайда «Types of Machine Learning Systems».", "options": ["Online, model-based, supervised", "Batch, instance-based, unsupervised", "Online, instance-based, self-supervised", "Batch, model-based, semi-supervised"], "type": "mcq", "answer": 0}, {"id": "ml-19", "topic": "ml", "q": "A model was trained with batch (offline) learning. New data arrives. What must you do so the model uses it?", "exp": "В batch learning модель после обучения **фиксирована**. Чтобы учесть новые данные, её переобучают заново на всём наборе (старые + новые). Это главный минус batch: негибкость и много вычислений за раз.", "options": ["Nothing, it updates automatically with each new sample", "Retrain it, typically from scratch on the full dataset including the new data", "Call `predict()` on the new data", "Increase the learning rate"], "type": "mcq", "answer": 1}, {"id": "ml-20", "topic": "ml", "q": "Which are examples of ONLINE learning from the lecture? (select all)", "exp": "Online learning — модель обновляется по одному примеру или маленькими порциями, пока данные приходят потоком. Классификатор на миллионе фото и цены домов по большому архиву продаж — примеры **batch** learning со слайда.", "options": ["Stock price prediction with new prices every second", "Spam detection that adapts every time a new email arrives", "Netflix / YouTube recommendations learning from each click", "Training an image classifier once on 1 million labeled cat/dog photos", "Predicting house prices from a big dataset of past sales"], "type": "multi", "answer": [0, 1, 2]}, {"id": "ml-21", "topic": "ml", "q": "Which is a limitation of ONLINE learning according to the lecture?", "exp": "Минусы online: каждое обновление менее стабильно (шум сбивает модель), может не дойти до точности batch без настройки, нужно аккуратно обращаться с «забыванием» старых данных.\nПереобучение с нуля и вся память сразу — это минусы **batch**.", "options": ["It must retrain from scratch whenever data changes", "It needs all data in memory at once", "Updates can be unstable: noisy data can mislead the model, and forgetting old data must be handled carefully", "It cannot adapt to new patterns"], "type": "mcq", "answer": 2}, {"id": "ml-22", "topic": "ml", "q": "Baidu's DeepSpeech was trained with mini-batch SGD on batches of about 256 samples. Why mini-batches?", "exp": "Mini-batch — середина между batch (всё сразу) и online (по одному). Обычно 32, 64, 128 примеров. Это самый частый подход в deep learning, потому что балансирует скорость и стабильность.", "options": ["Because SGD only works with exactly 256 samples", "The full dataset is too large to use at once, and single audio clips are too noisy, so mini-batches balance efficiency and stability", "Mini-batches remove the need for labels", "To make the model instance-based"], "type": "mcq", "answer": 1}, {"id": "ml-23", "topic": "ml", "q": "Which statement about INSTANCE-based (lazy) learning is TRUE?", "exp": "Instance-based: запомнить все примеры, при предсказании найти самые похожие и по ним ответить. Классика — kNN. Новые данные просто добавляются в память. Предсказание на больших данных **медленное**, потому что надо сравнить со всеми примерами.", "options": ["It builds an equation during training and then discards the data", "It stores the training data and, for a new input, compares it with stored examples using a similarity / distance measure", "It is fast at prediction time on huge datasets", "It cannot use new data without full retraining"], "type": "mcq", "answer": 1}, {"id": "ml-24", "topic": "ml", "q": "Which are limitations of instance-based learning? (select all)", "exp": "Первые три пункта — со слайда про instance-based. «Долгое обучение» — это минус **model-based** подхода: там нужно подбирать параметры, а kNN почти ничего не делает в `fit()`.", "options": ["Needs to store the whole dataset (memory expensive)", "Slow predictions on large datasets", "Sensitive to irrelevant features", "Needs a long training time to estimate parameters"], "type": "multi", "answer": [0, 1, 2]}, {"id": "ml-25", "topic": "ml", "q": "A model is built as `price = 50000 + 200*size - 100*distance_from_center` and only this equation is stored. Which approach is it?", "exp": "Строится математическая модель, хранятся только её параметры (50000, 200, −100), а не все данные. Это model-based / eager. Плюсы: компактно и быстро предсказывает.", "options": ["Model-based (eager) learning", "Instance-based (lazy) learning", "Unsupervised learning", "Reinforcement learning"], "type": "mcq", "answer": 0}, {"id": "ml-26", "topic": "ml", "q": "The life satisfaction model is `life_satisfaction = a0 + a1 * GDP_per_capita` with a0 = 3.75 and a1 = 6.78×10⁻⁵. Predict life satisfaction for Cyprus, GDP per capita $37,655. Round to 2 decimals.", "exp": "Подставляем в линейную модель:\n3.75 + 6.78e-5 × 37655 = 3.75 + 2.553 ≈ **6.30**.\nНа слайде так и написано: Model predict = 6.3. Это model-based предсказание для страны, которой нет в данных OECD.", "type": "num", "answer": 6.3, "tol": 0.02, "answerText": "≈ 6.30 (3.75 + 0.0000678 × 37655 = 6.303)"}, {"id": "ml-27", "topic": "ml", "q": "To find the best a0 and a1 for linear regression, what do people typically define?", "exp": "Можно задать utility/fitness function (насколько модель **хороша**) или cost function (насколько **плоха**). Для линейной регрессии обычно берут **cost function** — расстояние между предсказаниями и обучающими примерами — и минимизируют его.", "options": ["A utility (fitness) function and maximize it", "A cost function measuring the distance between the model's predictions and the training examples, and minimize it", "The accuracy on the test set and maximize it", "The number of neighbors k"], "type": "mcq", "answer": 1}, {"id": "ml-28", "topic": "ml", "q": "The linear life-satisfaction model makes poor predictions. What does the lecture suggest? (select all)", "exp": "Три совета со слайда 37. Оценка только на обучающих данных ничего не исправляет: она лишь скрывает проблему, потому что настоящая цель — хорошо работать на **новых** данных.", "options": ["Use more attributes: employment rate, health, air pollution, etc.", "Get more or better-quality training data", "Select a more powerful model, e.g. polynomial regression", "Evaluate only on the training set to get a better score"], "type": "multi", "answer": [0, 1, 2]}, {"id": "ml-29", "topic": "ml", "q": "Which Python framework from the course is a high-level deep learning API that comes bundled with TensorFlow?", "exp": "- **Scikit-Learn** — эффективная реализация многих классических ML-алгоритмов.\n- **TensorFlow** — распределённые вычисления, большие нейросети на многих GPU.\n- **Keras** — высокоуровневый API для deep learning, идёт вместе с TensorFlow и использует его для тяжёлых вычислений.", "options": ["Scikit-Learn", "Keras", "Pandas", "NumPy"], "type": "mcq", "answer": 1}, {"id": "ml-30", "topic": "ml", "q": "In ML terminology, the individual rows of a dataset are called ___ and their properties are called ___.", "exp": "Строки — **samples / instances** (training instance), столбцы-свойства — **features**. Форма массива данных = число samples × число features, например Iris `(150, 4)`.", "options": ["samples (instances); features", "features; samples", "labels; targets", "models; parameters"], "type": "mcq", "answer": 0}, {"id": "ir-01", "topic": "iris", "q": "What does `iris['data'].shape` return?", "exp": "150 цветков (samples) и 4 признака: sepal length, sepal width, petal length, petal width. Форма всегда **samples × features**. 3 — это число классов (видов), а не признаков.", "options": ["`(150, 4)`", "`(4, 150)`", "`(150,)`", "`(150, 3)`"], "type": "mcq", "answer": 0}, {"id": "ir-02", "topic": "iris", "q": "What does `iris['target'].shape` return?", "exp": "Target — одномерный массив, одно число на цветок: 0, 1 или 2. Поэтому форма `(150,)`, без второй размерности.", "options": ["`(150, 1)`", "`(150,)`", "`(3,)`", "`(150, 4)`"], "type": "mcq", "answer": 1}, {"id": "ir-03", "topic": "iris", "q": "`prediction = knn.predict(X_new)` returned `array([0])`. What does `iris['target_names'][prediction]` return?", "exp": "`target_names = ['setosa', 'versicolor', 'virginica']`, классы закодированы 0, 1, 2. Индексация массивом `[0]` возвращает массив `array(['setosa'])`.", "options": ["`array(['setosa'])`", "`'versicolor'`", "`0`", "`array(['virginica'])`"], "type": "mcq", "answer": 0}, {"id": "ir-04", "topic": "iris", "q": "What kind of object does `load_iris()` return, and how do you see what it contains?", "exp": "`load_iris()` возвращает **Bunch** — похоже на dict. `iris.keys()` даёт `'data'`, `'target'`, `'target_names'`, `'feature_names'`, `'DESCR'`. Описание датасета: `print(iris['DESCR'])`.", "options": ["A Bunch object, similar to a dictionary; use `iris.keys()`", "A pandas DataFrame; use `iris.head()`", "A NumPy array; use `iris.shape`", "A list; use `len(iris)`"], "type": "mcq", "answer": 0}, {"id": "ir-05", "topic": "iris", "q": "Complete the code to load Iris and split it into train and test sets.", "exp": "- `load_iris` лежит в `sklearn.datasets`.\n- `train_test_split` — в `sklearn.model_selection`.\n- `random_state=0` фиксирует seed генератора случайных чисел, чтобы при каждом запуске получалось одинаковое разбиение.\nПорядок возврата: **X_train, X_test, y_train, y_test**.", "code": "from sklearn.datasets import ⟦load_iris⟧\nfrom sklearn.⟦model_selection⟧ import train_test_split\n\niris = load_iris()\nX_train, X_test, y_train, y_test = ⟦train_test_split⟧(\n    iris['data'], iris['target'], ⟦random_state⟧=0)", "type": "fill"}, {"id": "ir-06", "topic": "iris", "q": "You call `train_test_split(iris['data'], iris['target'], random_state=0)` without `test_size`. What are the shapes of `X_train` and `X_test`?", "exp": "По умолчанию test set = **25%**. 150 × 0.25 = 37.5, округляется вверх до 38. В train остаётся 112. На лекции: 25% — хорошее эмпирическое правило.", "options": ["`(112, 4)` and `(38, 4)`", "`(120, 4)` and `(30, 4)`", "`(105, 4)` and `(45, 4)`", "`(75, 4)` and `(75, 4)`"], "type": "mcq", "answer": 0}, {"id": "ir-07", "topic": "iris", "q": "Why do we shuffle and stratify when splitting Iris into train/test?", "exp": "Данные Iris отсортированы по классу. Если взять последние 25% без перемешивания, в тесте окажется почти только один вид, и проверка ничего не скажет о качестве. `stratify` сохраняет пропорции классов в train и test.", "options": ["So the test set contains all three classes in the same proportions as the whole dataset", "To make the model train faster", "Because `train_test_split` cannot work without stratify", "To remove outliers"], "type": "mcq", "answer": 0}, {"id": "ir-08", "topic": "iris", "q": "Complete the code: build a kNN classifier with one neighbor, train it, and predict the species of a new flower.", "exp": "- Классификатор kNN — `KNeighborsClassifier` из `sklearn.neighbors`.\n- Число соседей задаётся параметром `n_neighbors` (это **hyperparameter**).\n- `fit(X_train, y_train)` обучает, `predict(X_new)` предсказывает.\nРезультат для этого цветка — `['setosa']`.", "code": "import numpy as np\nfrom sklearn.neighbors import ⟦KNeighborsClassifier⟧\n\nknn = KNeighborsClassifier(⟦n_neighbors⟧=1)\nknn.⟦fit⟧(X_train, y_train)\n\nX_new = np.array([[5, 2.9, 1, 0.2]])\nprediction = knn.⟦predict⟧(X_new)\nprint(iris['target_names'][prediction])", "type": "fill"}, {"id": "ir-09", "topic": "iris", "q": "Why is the new flower written as `np.array([[5, 2.9, 1, 0.2]])` with double brackets?", "exp": "`predict` ждёт таблицу: строки — объекты, столбцы — признаки. Один цветок с 4 признаками — форма `(1, 4)`. С одинарными скобками получилось бы `(4,)`, и sklearn выдаст ошибку «Expected 2D array».", "options": ["Double brackets make the values floats", "Scikit-Learn expects a 2D array (n_samples, n_features), so one flower has shape `(1, 4)`", "It is required by NumPy, not by Scikit-Learn", "Double brackets mean the array is sorted"], "type": "mcq", "answer": 1}, {"id": "ir-10", "topic": "iris", "q": "Complete both ways of computing test accuracy for the kNN model.", "exp": "`y_pred == y_test` даёт массив True/False. Среднее от него — доля правильных ответов, то есть **accuracy** (True = 1, False = 0).\n`knn.score(X_test, y_test)` сам вызывает predict и считает ту же accuracy для классификатора. На лекции получилось **0.97**.", "code": "y_pred = knn.predict(X_test)\nprint(np.⟦mean⟧(y_pred == y_test))\n\nprint(knn.⟦score⟧(X_test, y_test))", "type": "fill"}, {"id": "ir-11", "topic": "iris", "q": "`np.mean(y_pred == y_test)` returned `0.9736842105`. With 38 test flowers, how many were misclassified?", "exp": "0.97368 × 38 = 37 правильных. 38 − 37 = **1** ошибка. Удобный приём: умножить accuracy на размер test set.", "type": "num", "answer": 1.0, "tol": 0.0, "answerText": "1"}, {"id": "ir-12", "topic": "iris", "q": "kNN picture from the lecture: within the 3 nearest neighbors of the new point there are 2 triangles and 1 square; within the 5 nearest there are 3 squares and 2 triangles. What does kNN classification predict for k=3 and for k=5?", "exp": "KNeighborsClassifier голосует **большинством** среди k соседей:\n- k=3: 2 треугольника против 1 квадрата → треугольник.\n- k=5: 3 квадрата против 2 треугольников → квадрат.\nПоэтому k — важный **hyperparameter**: он может поменять ответ.", "options": ["k=3 → triangle, k=5 → square", "k=3 → square, k=5 → triangle", "Triangle in both cases, because the closest point is a triangle", "It cannot decide, because the classes are mixed"], "type": "mcq", "answer": 0}, {"id": "ir-13", "topic": "iris", "q": "Why should the model be evaluated on a test set and not on the data it was trained on?", "exp": "Хорошая точность на обучающих данных ещё ничего не гарантирует: модель могла просто запомнить их. Тест — это данные с известными метками, которых модель **не видела**, поэтому он показывает обобщение (generalization).", "options": ["Because the training set has no labels", "Because we need to know how well it generalizes to new data it has never seen", "Because accuracy cannot be computed on the training set", "Because test data is always cleaner"], "type": "mcq", "answer": 1}, {"id": "ir-14", "topic": "iris", "q": "Iris species prediction (setosa / versicolor / virginica) is:", "exp": "Возможные ответы — дискретные виды, они называются **classes**. Их три, значит three-class classification. Метки известны заранее, это supervised.", "options": ["A regression problem with 3 outputs", "A three-class classification problem", "A clustering problem", "A binary classification problem"], "type": "mcq", "answer": 1}, {"id": "ir-15", "topic": "iris", "q": "In scikit-learn convention, how are features and labels usually named?", "exp": "`X` с большой буквы — матрица признаков (2D), `y` с маленькой — вектор меток (1D). Отсюда `X_train, X_test, y_train, y_test`.", "options": ["Capital `X` for features, lowercase `y` for labels", "Lowercase `x` for features, capital `Y` for labels", "`data` and `target` only", "`train` and `test`"], "type": "mcq", "answer": 0}, {"id": "fi-01", "topic": "fit", "q": "Trying to train a self-driving car system with only 500 road images is an example of:", "exp": "Данных слишком мало, чтобы покрыть реальное разнообразие дорог. Сравнение со слайда: учить язык по 20 словам — не обобщится.", "options": ["Insufficient quantity of training data", "Nonrepresentative training data", "Irrelevant features", "Overfitting caused by regularization"], "type": "mcq", "answer": 0}, {"id": "fi-02", "topic": "fit", "q": "A facial recognition system is trained only on European faces and then deployed in Asia. What is the main problem?", "exp": "Обучающие данные не отражают реальную среду, где модель будет работать. Это **nonrepresentative training data**, пример прямо со слайда 50.", "options": ["Insufficient quantity of data", "Nonrepresentative training data", "Irrelevant features", "Underfitting"], "type": "mcq", "answer": 1}, {"id": "fi-03", "topic": "fit", "q": "Weather data contains a temperature recorded as 500°C because of a sensor error. Which category of bad data is this?", "exp": "Ошибки, выбросы и шум — **poor-quality data**. Из-за них модели труднее найти закономерность. На лекции отмечено: data scientists тратят много времени именно на очистку данных.", "options": ["Irrelevant features", "Poor-quality data (errors, outliers, noise)", "Nonrepresentative data", "Data mismatch"], "type": "mcq", "answer": 1}, {"id": "fi-04", "topic": "fit", "q": "Predicting house prices using the owner's favorite color is an example of:", "exp": "Любимый цвет владельца не связан с ценой. Такие признаки — irrelevant features. Решение — feature engineering: выбрать полезные признаки, скомбинировать существующие, собрать новые.", "options": ["Poor-quality data", "Irrelevant features (\"garbage in, garbage out\")", "Nonrepresentative training data", "Self-supervised learning"], "type": "mcq", "answer": 1}, {"id": "fi-05", "topic": "fit", "q": "Which steps belong to feature engineering according to the lecture? (select all)", "exp": "Три шага feature engineering со слайда 51. Regularization — это про ограничение **модели**, а train/test split — про **оценку**, к признакам они не относятся.", "options": ["Feature selection: choosing the most useful existing features", "Feature extraction: combining existing features into a more useful one", "Creating new features by gathering new data", "Regularization of the model", "Splitting data into train and test sets"], "type": "multi", "answer": [0, 1, 2]}, {"id": "fi-06", "topic": "fit", "q": "A model performs very well on the training data but poorly on new data. This is:", "exp": "Overfitting: модель слишком сложная относительно количества и шумности данных и запомнила шум. Синоним — high variance. Underfitting — это high bias: плохо даже на обучающих данных.", "options": ["Overfitting (high variance)", "Underfitting (high bias)", "Data mismatch, always", "Insufficient regularization of the test set"], "type": "mcq", "answer": 0}, {"id": "fi-07", "topic": "fit", "q": "Which are valid ways to fix OVERFITTING? (select all)", "exp": "Против overfitting — упростить, ограничить модель, дать больше данных, убрать шум.\nБолее мощная модель и **уменьшение** регуляризации — это способы борьбы с **underfitting**. Для overfitting они сделают только хуже.", "options": ["Simplify the model: fewer parameters, e.g. linear instead of high-degree polynomial", "Reduce the number of attributes in the training data", "Constrain the model (regularization)", "Gather more training data", "Reduce noise: fix data errors and remove outliers", "Select a more powerful model with more parameters", "Reduce the regularization hyperparameter"], "type": "multi", "answer": [0, 1, 2, 3, 4]}, {"id": "fi-08", "topic": "fit", "q": "Which are valid ways to fix UNDERFITTING? (select all)", "exp": "Underfitting — модель слишком простая и не ловит структуру данных даже на обучении. Нужно больше «мощности»: сложнее модель, лучше признаки, меньше ограничений. Упрощение и усиление регуляризации — от overfitting.", "options": ["Select a more powerful model with more parameters", "Feed better features to the learning algorithm (feature engineering)", "Reduce the constraints on the model, e.g. reduce the regularization hyperparameter", "Simplify the model", "Increase regularization"], "type": "multi", "answer": [0, 1, 2]}, {"id": "fi-09", "topic": "fit", "q": "The lecture says a linear model of life satisfaction is prone to:", "exp": "Слайд 54: линейная модель life satisfaction склонна к **underfitting**. Реальность сложнее одной прямой, поэтому предсказания будут неточными даже на обучающих примерах.", "options": ["Overfitting, because it has too many parameters", "Underfitting, because reality is more complex than the model", "Data mismatch", "Nothing, it is a perfect model"], "type": "mcq", "answer": 1}, {"id": "fi-10", "topic": "fit", "q": "The linear model has two parameters, θ0 and θ1. If we let the algorithm change θ1 but force it to stay small, the model effectively has:", "exp": "Два свободных параметра — 2 степени свободы. Если θ1 можно менять, но только в малых пределах, свобода где-то **между 1 и 2**. Это и есть **regularization**: ограничение модели, чтобы снизить риск overfitting.", "options": ["Exactly 1 degree of freedom", "Exactly 2 degrees of freedom", "Somewhere between 1 and 2 degrees of freedom", "0 degrees of freedom"], "type": "mcq", "answer": 2}, {"id": "fi-11", "topic": "fit", "q": "What is a hyperparameter?", "exp": "Hyperparameter задают **до** обучения, сам алгоритм его не подбирает. Пример: сила регуляризации, k в kNN. Параметры модели (`coef_`, `intercept_`, a0, a1) модель **выучивает** в `fit()`.", "options": ["A parameter of the learning algorithm (not of the model), set before training and not learned from the data", "A coefficient the model learns during training, like `coef_`", "The target column", "The test set error"], "type": "mcq", "answer": 0}, {"id": "fi-12", "topic": "fit", "q": "Which of these are HYPERPARAMETERS? (select all)", "exp": "Первые три — дословно со слайда «Hyperparameter Tuning». Сила регуляризации тоже hyperparameter (слайд 53). `intercept_`, a0, a1 модель вычисляет сама, это **параметры модели**.", "options": ["Number of neighbors in kNN", "Learning rate in neural networks", "Tree depth in decision trees", "The amount of regularization", "`intercept_` of a fitted LinearRegression", "The learned coefficients a0 and a1"], "type": "multi", "answer": [0, 1, 2, 3]}, {"id": "fi-13", "topic": "fit", "q": "The error rate of a model on new cases is called the ___, and we estimate it using the ___.", "exp": "Generalization error = out-of-sample error, ошибка на новых данных. Оценивают её на **test set**, который модель не видела при обучении.", "options": ["generalization (out-of-sample) error; test set", "training error; training set", "generalization error; training set", "bias; validation set only"], "type": "mcq", "answer": 0}, {"id": "fi-14", "topic": "fit", "q": "What is the correct holdout validation workflow from the lecture?", "exp": "Порядок со слайда 56:\n1. Часть training set откладываем как **validation set** (dev set).\n2. Учим несколько моделей и hyperparameters на уменьшенном training set.\n3. Выбираем лучшую по validation set.\n4. Переобучаем её на **полном** training set (вместе с validation).\n5. Один раз оцениваем на **test set**.", "options": ["Train candidate models on the reduced training set, pick the best on the validation set, retrain the best on the full training set (including validation), then evaluate once on the test set", "Train on the test set, pick the best on the validation set, report training accuracy", "Tune hyperparameters on the test set, then evaluate on the validation set", "Train once on all data including the test set, then evaluate on the test set"], "type": "mcq", "answer": 0}, {"id": "fi-15", "topic": "fit", "q": "Why shouldn't you tune hyperparameters by repeatedly measuring on the test set?", "exp": "Если много раз подбирать параметры по test set, вы фактически «учитесь» на нём. Ошибка на тесте становится заниженной, а в продакшене модель окажется хуже. Поэтому нужен отдельный validation set, а тест трогают в самом конце.", "options": ["The model and hyperparameters adapt to that particular test set, so the test error becomes optimistic and no longer estimates the real generalization error", "Because the test set has no labels", "Because sklearn forbids calling `score` on the test set more than once", "Because tuning is only allowed on the training set"], "type": "mcq", "answer": 0}, {"id": "fi-16", "topic": "fit", "q": "A spam filter is trained on English emails and tested on Arabic emails; performance drops a lot. This is:", "exp": "Data mismatch — train и test из **разных распределений**. Плохой результат на тесте тогда нельзя однозначно списать на overfitting. Ещё пример со слайда: модель погоды учили на летних данных, проверяют на зимних. Тестовые данные должны соответствовать реальной среде.", "options": ["Overfitting", "Data mismatch: training and test data come from different distributions", "Insufficient data", "Underfitting"], "type": "mcq", "answer": 1}, {"id": "fi-17", "topic": "fit", "q": "According to the lecture, which train/test split is suggested for a very LARGE dataset?", "exp": "75/25 — частый вариант. Для больших данных хватает 10% на тест (**90/10**), для маленьких лучше 70/30. Зависит от размера датасета.", "options": ["50/50", "70/30", "75/25", "90/10"], "type": "mcq", "answer": 3}, {"id": "fi-18", "topic": "fit", "q": "Which pair of \"bad things\" does the lecture name as the two main things that can go wrong in ML?", "exp": "Главная задача — выбрать модель и обучить её на данных. Поэтому сломаться может «bad algorithm» (overfitting, underfitting) или «bad data» (мало, нерепрезентативно, грязно, лишние признаки).", "options": ["Bad model (algorithm) and bad data", "Bad hardware and bad software", "Bad labels and bad metrics only", "Too many features and too few classes"], "type": "mcq", "answer": 0}, {"id": "fi-19", "topic": "fit", "q": "Overfitting is also known as ___ and underfitting as ___.", "exp": "Overfitting = **high variance**: модель сильно меняется от конкретных данных. Underfitting = **high bias**: модель слишком упрощённо смотрит на мир.", "options": ["high variance; high bias", "high bias; high variance", "low variance; low bias", "regularization; normalization"], "type": "mcq", "answer": 0}, {"id": "fi-20", "topic": "fit", "q": "Having a good performance measure on the training data is described in the lecture as:", "exp": "Слайд про instance-based vs model-based: хорошая метрика на training data — это хорошо, но **недостаточно**. Настоящая цель — хорошие предсказания для примеров, которых модель никогда не видела.", "options": ["Good, but insufficient: the true goal is to perform well on new instances", "Sufficient to deploy the model", "Meaningless, it should never be computed", "The same as the generalization error"], "type": "mcq", "answer": 0}, {"id": "pr-01", "topic": "project", "q": "What is the correct order of the main steps of an end-to-end ML project from Chapter 2?", "exp": "8 шагов со слайда Agenda:\n1. Look at the big picture.\n2. Get the data.\n3. Explore and visualize the data.\n4. Prepare the data for ML algorithms.\n5. Select a model and train it.\n6. Fine-tune your model.\n7. Present your solution.\n8. Launch, monitor, and maintain your system.", "options": ["Big picture → get data → explore & visualize → prepare data → select & train model → fine-tune → present → launch, monitor, maintain", "Get data → train model → explore → prepare data → fine-tune → big picture → present → launch", "Big picture → prepare data → get data → train model → explore → present → fine-tune → launch", "Get data → prepare data → big picture → explore → fine-tune → train model → launch → present"], "type": "mcq", "answer": 0}, {"id": "pr-02", "topic": "project", "q": "In the California Housing project, what is the target the model must predict?", "exp": "Модель по остальным метрикам района (block group) должна предсказать **median housing price**, столбец `median_house_value`. `median_income` — самый полезный признак, но не target.", "options": ["`median_income`", "`median_house_value` of a district", "`ocean_proximity`", "`population`"], "type": "mcq", "answer": 1}, {"id": "pr-03", "topic": "project", "q": "How is the California Housing task framed in the lecture?", "exp": "- **Supervised**: у каждого района есть правильный ответ (цена).\n- **Regression**: предсказываем число.\n- **Multiple** regression: используем несколько признаков.\n- **Univariate**: предсказываем одно значение на район.\n- **Batch**: данные не приходят потоком и помещаются в память.", "options": ["Supervised, regression (multiple, univariate), batch learning", "Unsupervised, clustering, online learning", "Supervised, classification, online learning", "Semi-supervised, multivariate regression, batch learning"], "type": "mcq", "answer": 0}, {"id": "pr-04", "topic": "project", "q": "Why is the housing problem called a \"multiple regression\" problem?", "exp": "**Multiple** — много входных признаков. Ловушка: если бы предсказывали **несколько значений** на район, это была бы **multivariate** regression.", "options": ["Because the system uses multiple features to make a prediction", "Because it predicts multiple values per district", "Because it uses multiple models", "Because the data is split multiple times"], "type": "mcq", "answer": 0}, {"id": "pr-05", "topic": "project", "q": "If we wanted to predict BOTH the median price and the average rent for each district, the problem would be:", "exp": "Univariate — одно предсказываемое значение, multivariate — несколько выходов. Количество входных признаков на это не влияет.", "options": ["Univariate regression", "Multivariate regression", "Binary classification", "Clustering"], "type": "mcq", "answer": 1}, {"id": "pr-06", "topic": "project", "q": "If the housing data were huge, what does the lecture suggest?", "exp": "Слайд 7: при огромных данных можно распределить batch learning на несколько серверов (**MapReduce**) или перейти на **online learning**.", "options": ["Split batch learning across multiple servers (MapReduce) or use online learning", "Use only the first 1000 rows", "Switch to unsupervised learning", "Remove all numerical features"], "type": "mcq", "answer": 0}, {"id": "pr-07", "topic": "project", "q": "What is a data pipeline according to the lecture?", "exp": "Pipeline — цепочка компонентов обработки данных. Компоненты работают асинхронно, а интерфейс между ними — просто хранилище данных (data store). В sklearn есть класс `Pipeline` с той же идеей: шаги обработки по порядку.", "options": ["A sequence of data processing components; each pulls data, processes it and puts the result into a data store for the next one", "A single function that trains the model", "A plot of the data", "A type of neural network"], "type": "mcq", "answer": 0}, {"id": "pr-08", "topic": "project", "q": "Which is a benefit of the pipeline architecture mentioned in the lecture?", "exp": "Плюсы со слайда 6: система проста для понимания, разные команды делают разные компоненты, архитектура устойчива — при поломке одного компонента следующие какое-то время работают на последних доступных данных.\nЛовушка: из-за этого поломку можно долго не заметить, поэтому мониторинг всё равно нужен.", "options": ["If one component breaks down, downstream components can often keep running normally for a while", "Pipelines never need monitoring", "Pipelines make data cleaning unnecessary", "All components must be written by the same team"], "type": "mcq", "answer": 0}, {"id": "pr-09", "topic": "project", "q": "Why does the lecture ask \"what does the current solution look like (if any)?\"", "exp": "Текущее решение — эксперты оценивают цены вручную по сложным правилам. Это дорого, долго и неточно. Оно даёт **ориентир по качеству** и подсказки, как решать задачу.", "options": ["It gives a reference for performance and insights on how to solve the problem", "Because the new model must copy the current solution exactly", "To decide which programming language to use", "To choose the test set"], "type": "mcq", "answer": 0}, {"id": "pr-10", "topic": "project", "q": "While checking assumptions, you learn the downstream system converts prices into \"cheap\", \"medium\" and \"expensive\" and only uses these categories. How should the problem be framed then?", "exp": "Если нужна только категория, точная цена не важна. Задача становится **классификацией**. Поэтому проверка предположений важна. В лекции команда подтвердила, что нужны реальные цены, значит остаётся регрессия.", "options": ["Still regression, nothing changes", "As a classification task", "As clustering", "As reinforcement learning"], "type": "mcq", "answer": 1}, {"id": "pr-11", "topic": "project", "q": "Actual temperature tomorrow is 25°C. Predictions are 24°C, 26°C and 25.5°C. Compute the MAE (2 decimals).", "exp": "MAE = среднее **модулей** ошибок:\n(|24−25| + |26−25| + |25.5−25|) / 3 = (1 + 1 + 0.5) / 3 = 2.5 / 3 ≈ **0.83**.", "type": "num", "answer": 0.83, "tol": 0.011, "answerText": "≈ 0.83 (= (1 + 1 + 0.5) / 3)"}, {"id": "pr-12", "topic": "project", "q": "Same data: actual 25°C, predictions 24, 26, 25.5. Compute the RMSE (2 decimals).", "exp": "RMSE = корень из среднего **квадратов** ошибок:\n√((1² + 1² + 0.5²) / 3) = √(2.25 / 3) = √0.75 ≈ **0.87**.\nRMSE получился больше MAE (0.83), так всегда: RMSE ≥ MAE.", "type": "num", "answer": 0.87, "tol": 0.011, "answerText": "≈ 0.87 (= √((1 + 1 + 0.25) / 3))"}, {"id": "pr-13", "topic": "project", "q": "Now a 4th prediction of 35°C is added (actual still 25°C). Predictions: 24, 26, 25.5, 35. Compute the MAE.", "exp": "(1 + 1 + 0.5 + 10) / 4 = 12.5 / 4 = **3.125**.\nОдин выброс поднял MAE с 0.83 до 3.125 — линейно, пропорционально размеру ошибки.", "type": "num", "answer": 3.125, "tol": 0.011, "answerText": "3.125"}, {"id": "pr-14", "topic": "project", "q": "Predictions 24, 26, 25.5, 35 with actual 25°C. Compute the RMSE (2 decimals).", "exp": "√((1² + 1² + 0.5² + 10²) / 4) = √(102.25 / 4) = √25.5625 ≈ **5.06**.\nВыброс 10° в квадрате дал 100 — RMSE вырос с 0.87 до ~5.06, намного сильнее, чем MAE. Это и значит «RMSE strongly affected by outliers».", "type": "num", "answer": 5.06, "tol": 0.015, "answerText": "≈ 5.06 (на слайде округлено до 5.05)"}, {"id": "pr-15", "topic": "project", "q": "Which relation between RMSE and MAE is always true for the same predictions?", "exp": "Возведение в квадрат сильнее штрафует большие ошибки, поэтому RMSE **всегда ≥ MAE**. Равны они только когда все ошибки одинаковы по модулю.", "options": ["RMSE ≥ MAE", "RMSE ≤ MAE", "RMSE = MAE", "RMSE = MAE²"], "type": "mcq", "answer": 0}, {"id": "pr-16", "topic": "project", "q": "You predict medication dosage, where a single large mistake can be dangerous. Which metric should you prefer?", "exp": "Таблица со слайда 9: RMSE — для safety-critical задач (дозировка лекарств, дистанция в беспилотниках, прогноз наводнений). MAE — для общей отчётности (среднее время доставки, перепись населения).", "options": ["MAE, because it is easier to explain", "RMSE, because it penalizes large errors more heavily", "Accuracy", "Correlation coefficient"], "type": "mcq", "answer": 1}, {"id": "pr-17", "topic": "project", "q": "\"On average, our predictions are off by 5 units.\" Which metric gives this direct interpretation?", "exp": "MAE — среднее модулей ошибок, его легко объяснить нетехническим людям: «в среднем ошибаемся на X». RMSE объяснить сложнее.", "options": ["MAE = 5", "RMSE = 5", "Accuracy = 5%", "r = 0.5"], "type": "mcq", "answer": 0}, {"id": "pr-18", "topic": "project", "q": "Complete the NumPy code that computes MAE and RMSE.", "exp": "- MAE: среднее (`np.mean`) модулей (`np.abs`) разностей.\n- RMSE: квадраты разностей (`** 2`), среднее, затем корень (`np.sqrt`).\nВ Python степень — это `**`, а не `^` (`^` — побитовое XOR).", "code": "import numpy as np\nmae = np.⟦mean⟧(np.⟦abs⟧(y - y_pred))\nrmse = np.⟦sqrt⟧(np.mean((y - y_pred) ⟦**⟧ 2))", "type": "fill"}, {"id": "pr-19", "topic": "project", "q": "In ML, both RMSE and MAE can be seen as ways to measure:", "exp": "Слайд 10: RMSE и MAE — две меры **расстояния между двумя векторами**: вектором предсказаний и вектором правильных ответов.", "options": ["The distance between the vector of predictions and the vector of target values", "The correlation between two features", "The number of misclassified samples", "The variance of the input features"], "type": "mcq", "answer": 0}, {"id": "pr-20", "topic": "project", "q": "A block group (district) in the California Housing data typically has a population of:", "exp": "Слайд 5: block group — наименьшая географическая единица в данных, обычно **600–3000** человек.", "options": ["600 to 3,000 people", "10 to 100 people", "50,000 to 100,000 people", "Exactly 1,000 people"], "type": "mcq", "answer": 0}, {"id": "pr-21", "topic": "project", "q": "Which of these is a META portal that lists open data repositories (not a dataset repository itself)?", "exp": "Kaggle, UCI, OpenML, PapersWithCode, AWS datasets — это **репозитории** данных. Meta portals (списки репозиториев) — DataPortals.org и OpenDataMonitor.eu.", "options": ["Kaggle.com", "UC Irvine Machine Learning Repository", "DataPortals.org", "OpenML.org"], "type": "mcq", "answer": 2}, {"id": "pr-22", "topic": "project", "q": "Which metric is LESS affected by outliers?", "exp": "MAE растёт линейно с ошибкой, RMSE — квадратично. Поэтому MAE **less affected**, RMSE **strongly affected** выбросами.", "options": ["MAE", "RMSE", "Both equally", "Neither depends on errors"], "type": "mcq", "answer": 0}, {"id": "ex-01", "topic": "explore", "q": "`housing.info()` shows 20,640 entries, but `total_bedrooms` has only 20,433 non-null values. How many districts are missing this feature?", "exp": "20640 − 20433 = **207** пропусков. Их нужно обработать позже: dropna, drop столбца или imputation.", "type": "num", "answer": 207.0, "tol": 0.0, "answerText": "207"}, {"id": "ex-02", "topic": "explore", "q": "All housing attributes are numerical except one. Which, and which method shows its categories with counts?", "exp": "`ocean_proximity` — текст (dtype object/str). `housing[\"ocean_proximity\"].value_counts()` показывает категории и сколько районов в каждой: `<1H OCEAN` 9136, `INLAND` 6551, `NEAR OCEAN` 2658, `NEAR BAY` 2290, `ISLAND` 5. `unique()` дал бы только названия без количества.", "options": ["`ocean_proximity`; `value_counts()`", "`median_income`; `describe()`", "`ocean_proximity`; `describe()`", "`total_bedrooms`; `unique()`"], "type": "mcq", "answer": 0}, {"id": "ex-03", "topic": "explore", "q": "`housing.describe()` shows for `housing_median_age`: 25% = 18, 50% = 29, 75% = 37. Which statement is correct?", "exp": "Перцентиль — значение, **ниже** которого лежит данный процент наблюдений. 25% районов моложе 18 лет, 50% — моложе 29 (это **медиана**, а не среднее), 75% — моложе 37.", "options": ["25% of districts have a housing median age lower than 18", "The mean housing median age is 29", "75% of districts have a housing median age higher than 37", "The maximum age is 37"], "type": "mcq", "answer": 0}, {"id": "ex-04", "topic": "explore", "q": "In the output of `describe()`, what does the `std` row show?", "exp": "`std` — стандартное отклонение, мера разброса. `count` — число непустых значений, `50%` — медиана. Самого частого значения в describe по числовым колонкам нет.", "options": ["The standard deviation: how dispersed the values are", "The number of non-null values", "The median", "The most frequent value"], "type": "mcq", "answer": 0}, {"id": "ex-05", "topic": "explore", "q": "Complete the code that draws a histogram for every numerical attribute with 50 bins.", "exp": "`DataFrame.hist()` рисует по гистограмме на каждый числовой столбец. `bins` — число корзин. `plt.tight_layout()` подгоняет отступы, чтобы подписи и заголовки не налезали друг на друга.", "code": "import matplotlib.pyplot as plt\n\nhousing.⟦hist⟧(⟦bins⟧=50, figsize=(12, 8))\nplt.⟦tight_layout⟧()\nplt.show()", "type": "fill"}, {"id": "ex-06", "topic": "explore", "q": "In the housing data, a `median_income` value of 3 actually means:", "exp": "Команда, собиравшая данные, отмасштабировала доход и ограничила его на 15. Числа ≈ **десятки тысяч долларов**: 3 ≈ $30,000. Работа с предобработанными признаками — обычное дело в ML.", "options": ["About $30,000, because income was scaled and capped (units ≈ tens of thousands of dollars)", "$3 per year", "$3,000,000", "3% of the average income"], "type": "mcq", "answer": 0}, {"id": "ex-07", "topic": "explore", "q": "`median_house_value` is capped at $500,000. Why is this a serious problem and what are the options?", "exp": "Это **target**. Модель выучит, что цены не бывают выше $500k. Варианты со слайда: собрать правильные метки для обрезанных районов или удалить эти районы из обучающей выборки (и тогда модель не будут оценивать на ценах выше $500k).", "options": ["It is the target, so the model may learn prices never exceed the limit; either collect proper labels for capped districts or remove them from the training set", "It is not a problem, because capping removes outliers", "Convert the target to categories", "Scale it with MinMaxScaler to fix the cap"], "type": "mcq", "answer": 0}, {"id": "ex-08", "topic": "explore", "q": "Many housing histograms are \"skewed right\". What does this mean and why care?", "exp": "Правый хвост: большинство значений небольшие, но есть редкие очень большие. Некоторым алгоритмам так сложнее. Позже такие признаки делают симметричнее: логарифм, корень, бакеты.", "options": ["They have a long tail to the right; this can make it harder for some algorithms to detect patterns, so we may transform them (e.g. log)", "Values are mostly very large with a few small ones", "The data has no outliers", "The histogram must be drawn with fewer bins"], "type": "mcq", "answer": 0}, {"id": "ex-09", "topic": "explore", "q": "Why should you create the test set BEFORE looking further at the data?", "exp": "Слайд: «create a test set, put it aside, and never look at it». Если изучать весь датасет, можно невольно подогнать решения под тест. Тогда ошибка на тесте будет заниженной. В ноутбуке это названо так: работаем только с train, чтобы избежать **data leakage**.", "options": ["Otherwise your brain may spot patterns in the test data and pick a model that fits them, making the generalization estimate too optimistic (data snooping / leakage)", "Because sklearn requires it", "Because test data must be cleaned first", "To make training faster"], "type": "mcq", "answer": 0}, {"id": "ex-10", "topic": "explore", "q": "Complete the code: random 80/20 split of the housing DataFrame, reproducible between runs.", "exp": "`test_size=0.2` — 20% в test. `random_state=42` фиксирует случайность, чтобы разбиение было одинаковым при каждом запуске.\nЕсли передать один DataFrame, функция вернёт **два** объекта: train и test.", "code": "from sklearn.model_selection import train_test_split\n\ntrain_set, test_set = train_test_split(housing, ⟦test_size⟧=0.2, ⟦random_state⟧=42)", "type": "fill"}, {"id": "ex-11", "topic": "explore", "q": "Which is a useful feature of `train_test_split()` mentioned in the lecture?", "exp": "Особенности со слайда 17:\n- `random_state` задаёт seed.\n- Можно передать **несколько** наборов с одинаковым числом строк (например, X и отдельный DataFrame с метками), и они разрежутся по одним и тем же индексам.\n- `stratify=` даёт стратифицированное разбиение.\nПо умолчанию данные **перемешиваются**.", "options": ["You can pass several datasets with the same number of rows, and it splits them on the same indices", "It always splits 50/50", "It never shuffles the data", "It automatically fills missing values"], "type": "mcq", "answer": 0}, {"id": "ex-12", "topic": "explore", "q": "A university has 70% undergraduates, 20% master's and 10% PhD students. A stratified sample of 100 students contains:", "exp": "Стратифицированная выборка сохраняет пропорции каждой подгруппы (strata) как в популяции: 70 / 20 / 10.", "options": ["70 undergraduates, 20 master's, 10 PhD", "34, 33, 33", "100 undergraduates", "A random mix that can be anything"], "type": "mcq", "answer": 0}, {"id": "ex-13", "topic": "explore", "q": "What is a stratum?", "exp": "Stratum (мн. ч. strata) — подгруппа с общим признаком. Пример с лекции: пациенты с диабетом / с болезнью сердца / здоровые. Каждый stratum должен попасть в выборку в той же доле, что и в популяции.", "options": ["A subgroup of the population sharing a common characteristic, e.g. patients with diabetes", "A single outlier", "A column with missing values", "The test set"], "type": "mcq", "answer": 0}, {"id": "ex-14", "topic": "explore", "q": "Complete the code that creates an income category column with 5 categories for stratified sampling.", "exp": "`pd.cut` режет непрерывный признак на интервалы по заданным границам `bins`. `np.inf` — бесконечность: последняя категория — всё выше 6. `labels` — имена категорий. Для 6 границ получается 5 интервалов, поэтому 5 меток.", "code": "import numpy as np\nimport pandas as pd\n\nhousing[\"income_cat\"] = pd.⟦cut⟧(housing[\"median_income\"],\n                               bins=[0., 1.5, 3.0, 4.5, 6., np.⟦inf⟧],\n                               ⟦labels⟧=[1, 2, 3, 4, 5])", "type": "fill"}, {"id": "ex-15", "topic": "explore", "q": "With `bins=[0., 1.5, 3.0, 4.5, 6., np.inf]` and `labels=[1, 2, 3, 4, 5]`, which category does a district with `median_income = 3.0` get?", "exp": "`pd.cut` по умолчанию делает интервалы закрытыми **справа**: (0, 1.5], (1.5, 3.0], (3.0, 4.5]… Значение 3.0 входит в (1.5, 3.0], это категория **2**. Аналогично 1.5 → категория 1.", "options": ["1", "2", "3", "NaN, because 3.0 is exactly on the border"], "type": "mcq", "answer": 1}, {"id": "ex-16", "topic": "explore", "q": "Why should you not create too many income strata?", "exp": "Слайд 20: важно, чтобы в каждом stratum было достаточно примеров. Поэтому страт не должно быть слишком много, и каждая должна быть достаточно большой.", "options": ["Each stratum must contain enough instances, otherwise the estimate of the stratum's importance may be biased", "Because pd.cut supports at most 5 bins", "Because more strata always cause overfitting", "Because stratify only works with binary labels"], "type": "mcq", "answer": 0}, {"id": "ex-17", "topic": "explore", "q": "Complete the code that performs a stratified 80/20 split based on the income category.", "exp": "`stratify=` получает столбец, по которому сохраняем пропорции. Здесь это `income_cat`, а не сам `median_income`: стратифицировать можно только по **категориям**, а непрерывный доход сначала разбили на 5 групп через `pd.cut`.", "code": "strat_train_set, strat_test_set = train_test_split(\n    housing, test_size=0.2, ⟦stratify⟧=housing[\"⟦income_cat⟧\"], random_state=42)", "type": "fill"}, {"id": "ex-18", "topic": "explore", "q": "Complete the code that computes the proportion of each income category in the stratified test set.", "exp": "`value_counts()` — сколько строк в каждой категории. Делим на `len(...)`, число строк, и получаем доли. Сравнив их с долями в полном датасете, видим, что стратификация сработала.", "code": "strat_test_set[\"income_cat\"].⟦value_counts⟧() / ⟦len⟧(strat_test_set)", "type": "fill"}, {"id": "ex-19", "topic": "explore", "q": "The comparison table shows for income category 1: Overall 3.98%, Stratified 4.00%, Random 4.24% (Rand. Error 6.45%). What is the conclusion?", "exp": "Ошибка стратифицированной выборки — доли процента (0.36%), случайной — до 6.45%. Стратификация делает test set репрезентативным по доходу, самому важному признаку.", "options": ["The stratified test set has proportions almost identical to the full dataset, while the purely random test set is skewed", "Random sampling is always better", "Category 1 should be removed", "Stratification changes the target values"], "type": "mcq", "answer": 0}, {"id": "ex-20", "topic": "explore", "q": "Complete the code that removes the helper column `income_cat` from both sets after splitting.", "exp": "- `axis=1` — удаляем **столбец** (`axis=0` — строки).\n- `inplace=True` — меняем сам DataFrame, а не возвращаем копию.\n`income_cat` был нужен только для стратифицированного разбиения, дальше он не нужен.", "code": "for set_ in (strat_train_set, strat_test_set):\n    set_.drop(\"income_cat\", ⟦axis⟧=⟦1⟧, ⟦inplace⟧=True)", "type": "fill"}, {"id": "ex-21", "topic": "explore", "q": "In `df.drop(\"col\", axis=1)`, what does `axis=1` mean?", "exp": "`axis=0` — строки (индекс), `axis=1` — столбцы. Альтернатива без axis: `df.drop(columns=[\"col\"])`, как в лабе с пингвинами.", "options": ["Drop a column", "Drop a row", "Drop the first row", "Drop all missing values"], "type": "mcq", "answer": 0}, {"id": "ex-22", "topic": "explore", "q": "Why does the notebook do `housing = strat_train_set.copy()` before exploring?", "exp": "Дальше будут добавляться новые столбцы и пробоваться преобразования. Копия защищает `strat_train_set` от изменений. Работаем только с train, а test отложен.", "options": ["To experiment with transformations on a copy of the training set and be able to revert to the original; the test set stays untouched", "Because copy() shuffles the data", "Because copy() removes missing values", "To merge the train and test sets"], "type": "mcq", "answer": 0}, {"id": "ex-23", "topic": "explore", "q": "Complete the code: a geographical scatter plot where high-density areas are easier to see.", "exp": "По X — долгота (`longitude`), по Y — широта (`latitude`), так получается карта. `alpha=0.2` делает точки полупрозрачными: там, где они накладываются, цвет темнее, и видны районы высокой плотности.", "code": "housing.plot(kind=\"⟦scatter⟧\", x=\"⟦longitude⟧\", y=\"latitude\", grid=True, ⟦alpha⟧=0.2)\nplt.show()", "type": "fill"}, {"id": "ex-24", "topic": "explore", "q": "Complete the code: circle radius = population, color = house price, with the \"jet\" colormap.", "exp": "- `s` — size, размер точки: население / 100.\n- `c` — color, цвет по цене.\n- `cmap=\"jet\"` — палитра от синего (дёшево) до красного (дорого).\n- `colorbar=True` — шкала цветов.\nВывод со слайда: цена сильно зависит от расположения (близость к океану) и плотности населения.", "code": "housing.plot(kind=\"scatter\", x=\"longitude\", y=\"latitude\", grid=True,\n             ⟦s⟧=housing[\"population\"] / 100, label=\"population\",\n             ⟦c⟧=\"median_house_value\", ⟦cmap⟧=\"jet\", colorbar=True,\n             legend=True, figsize=(10, 7))\nplt.show()", "type": "fill"}, {"id": "ex-25", "topic": "explore", "q": "Complete the code that shows how strongly each attribute correlates with the median house value.", "exp": "`corr()` считает коэффициент Пирсона r между каждой парой столбцов. Берём столбец target и сортируем по убыванию: сверху самые положительно связанные признаки. `numeric_only=True` нужен, потому что есть текстовый `ocean_proximity`.", "code": "corr_matrix = housing.⟦corr⟧(⟦numeric_only⟧=True)\ncorr_matrix[\"median_house_value\"].⟦sort_values⟧(ascending=False)", "type": "fill"}, {"id": "ex-26", "topic": "explore", "q": "Why does the notebook pass `numeric_only=True` to `corr()`?", "exp": "Корреляцию можно считать только для чисел. Начиная с pandas 2.0 `numeric_only` по умолчанию False, и текстовый столбец ломает расчёт. Поэтому явно ставим True.", "options": ["Since pandas 2.0 it defaults to False, so a text column like `ocean_proximity` would cause an error", "It makes the correlation faster but gives the same result in all versions", "It removes missing values", "It converts text to numbers"], "type": "mcq", "answer": 0}, {"id": "ex-27", "topic": "explore", "q": "Which attribute is the most promising predictor of `median_house_value` (r ≈ 0.69)?", "exp": "Корреляция с target: `median_income` **0.688** — самая высокая. Дальше `total_rooms` 0.137 и `housing_median_age` 0.102, а `latitude` даже −0.140.", "options": ["`median_income`", "`total_rooms`", "`latitude`", "`population`"], "type": "mcq", "answer": 0}, {"id": "ex-28", "topic": "explore", "q": "Two variables have a Pearson correlation coefficient of 0. What can you conclude?", "exp": "r измеряет только **линейную** связь. На слайде нижний ряд графиков имеет r = 0, хотя оси явно связаны (кольцо, парабола и т.п.). Значит, r ≈ 0 не означает «нет зависимости».", "options": ["They are completely independent", "There is no LINEAR correlation, but there may still be a nonlinear relationship", "One of them is constant", "They are perfectly correlated"], "type": "mcq", "answer": 1}, {"id": "ex-29", "topic": "explore", "q": "`latitude` has r = −0.14 with `median_house_value`. Correct interpretation:", "exp": "Знак минус — обратная связь, |r| = 0.14 — слабая. Близко к −1 — сильная отрицательная связь, близко к 0 — линейной связи почти нет.", "options": ["A weak negative linear tendency: prices slightly tend to go down when going north", "A strong negative relationship", "Prices go up strongly when going north", "No information, because negative r is invalid"], "type": "mcq", "answer": 0}, {"id": "ex-30", "topic": "explore", "q": "How many plots would pandas `scatter_matrix()` draw for 11 numerical attributes?", "exp": "Каждый признак против каждого: 11² = **121** график. Это не помещается на страницу, поэтому в лекции выбрали 4 самых перспективных признака.", "type": "num", "answer": 121.0, "tol": 0.0, "answerText": "121 (11 × 11)"}, {"id": "ex-31", "topic": "explore", "q": "Complete the import and the call that plots every attribute against every other for 4 chosen attributes.", "exp": "`scatter_matrix` лежит в `pandas.plotting`. По диагонали — гистограммы, вне диагонали — scatter для каждой пары.", "code": "from pandas.⟦plotting⟧ import ⟦scatter_matrix⟧\n\nattributes = [\"median_house_value\", \"median_income\", \"total_rooms\",\n              \"housing_median_age\"]\nscatter_matrix(housing[attributes], figsize=(12, 8))\nplt.show()", "type": "fill"}, {"id": "ex-32", "topic": "explore", "q": "The scatter plot of `median_income` vs `median_house_value` shows horizontal lines at $500,000, ~$450,000, ~$350,000 and ~$280,000. What does the lecture suggest?", "exp": "$500k — это cap. Остальные горизонтальные линии — менее очевидные странности данных. Модель может начать их воспроизводить, поэтому такие районы можно удалить.", "options": ["Possibly remove those districts so the algorithms don't learn to reproduce these data quirks", "Nothing, they are normal", "Use them as a separate target", "Increase the number of bins"], "type": "mcq", "answer": 0}, {"id": "ex-33", "topic": "explore", "q": "Complete the attribute combinations from the lecture.", "exp": "Общее число комнат в районе мало что говорит, пока не знаешь, сколько там домохозяйств. Полезнее **комнаты на домохозяйство**, **доля спален среди комнат** и **людей на домохозяйство**. После этого `bedrooms_ratio` (r ≈ −0.26) оказался связан с ценой сильнее, чем `total_rooms` или `total_bedrooms`.", "code": "housing[\"rooms_per_house\"] = housing[\"total_rooms\"] / housing[\"⟦households⟧\"]\nhousing[\"bedrooms_ratio\"] = housing[\"total_bedrooms\"] / housing[\"⟦total_rooms⟧\"]\nhousing[\"people_per_house\"] = housing[\"⟦population⟧\"] / housing[\"households\"]", "type": "fill"}, {"id": "ex-34", "topic": "explore", "q": "After combining attributes, `bedrooms_ratio` has r ≈ −0.26 with `median_house_value`. What does that suggest?", "exp": "Отрицательная корреляция: чем меньше спален относительно всех комнат, тем дороже. По модулю 0.26 больше, чем у `total_rooms` (0.14), значит новый признак полезнее исходных.", "options": ["Houses with a lower bedroom/room ratio tend to be more expensive, and this feature is more informative than total rooms or total bedrooms alone", "Houses with more bedrooms per room are more expensive", "The feature is useless because r is negative", "It must be removed because it was created manually"], "type": "mcq", "answer": 0}, {"id": "ex-35", "topic": "explore", "q": "Complete the code that separates predictors and labels from the stratified training set.", "exp": "Признаки — всё, кроме target. Метки — копия столбца target. Разделяем, потому что к признакам и к target не обязательно применять одинаковые преобразования.", "code": "housing = strat_train_set.⟦drop⟧(\"median_house_value\", axis=1)\nhousing_labels = strat_train_set[\"median_house_value\"].⟦copy⟧()", "type": "fill"}, {"id": "ex-36", "topic": "explore", "q": "Does `strat_train_set.drop(\"median_ объединить их (feature extraction).", "options": ["They have a strong positive linear relationship, they carry very similar information", "One causes the other", "Both are useless", "They have a weak relationship"], "type": "mcq", "answer": 0}, {"id": "ex-40", "topic": "explore", "q": "If the training set is very large, what does the lecture suggest for the exploration phase?", "exp": "Слайд 23: если training set огромный, можно взять из него выборку для исследования, чтобы всё работало быстро. Test set при этом по-прежнему не трогаем.", "options": ["Sample an exploration set to make manipulations easy and fast", "Explore the test set instead", "Skip exploration", "Use only the first 10 rows"], "type": "mcq", "answer": 0}, {"id": "cl-01", "topic": "clean", "q": "Complete the three options from the book for handling missing `total_bedrooms` values.", "exp": "1. `dropna(subset=[...])` — удалить **районы (строки)** с пропуском именно в этом столбце.\n2. `drop(..., axis=1)` — удалить **весь признак**.\n3. `fillna(median)` — заполнить пропуски медианой. Это **imputation**, наименее разрушительный вариант.", "code": "housing.⟦dropna⟧(subset=[\"total_bedrooms\"], inplace=True)    # option 1\nhousing.⟦drop⟧(\"total_bedrooms\", axis=1)                    # option 2\nmedian = housing[\"total_bedrooms\"].⟦median⟧()              # option 3\nhousing[\"total_bedrooms\"] = housing[\"total_bedrooms\"].⟦fillna⟧(median)", "type": "fill"}, {"id": "cl-02", "topic": "clean", "q": "What does `housing.dropna(subset=[\"total_bedrooms\"])` do?", "exp": "`subset` ограничивает проверку пропусков указанными столбцами. Удаляются **строки**, у которых пропуск именно в `total_bedrooms`. Без `subset` удалились бы строки с NaN в любом столбце.", "options": ["Removes the rows (districts) where `total_bedrooms` is missing", "Removes the `total_bedrooms` column", "Fills missing values with 0", "Removes every row that has a missing value in any column, ignoring subset"], "type": "mcq", "answer": 0}, {"id": "cl-03", "topic": "clean", "q": "Which of the three options is the least destructive, and what is it called?", "exp": "Удаление строк теряет данные, удаление столбца теряет признак. Заполнение (zero, mean, median…) называется **imputation** и сохраняет и строки, и признак.", "options": ["Setting missing values to some value (e.g. the median): imputation", "Dropping the rows: imputation", "Dropping the column: feature selection", "Dropping the rows: regularization"], "type": "mcq", "answer": 0}, {"id": "cl-04", "topic": "clean", "q": "In the class notebook (pandas 3), after running the code below, `isnull().sum()` still shows 168 missing values in `total_bedrooms`. Why?", "exp": "`housing_option3[\"total_bedrooms\"]` — промежуточный объект. С Copy-on-Write (pandas 3) `inplace=True` меняет **его**, а не DataFrame. В pandas 2 это ещё работало, но выдавало предупреждение.\nПравильно:\n```\nhousing_option3[\"total_bedrooms\"] = housing_option3[\"total_bedrooms\"].fillna(median)\n```\nТо же касается старого кода Titanic `df['embarked'].fillna(..., inplace=True)`.", "code": "housing_option3 = housing.copy()\nmedian = housing[\"total_bedrooms\"].median()\nhousing_option3[\"total_bedrooms\"].fillna(median, inplace=True)", "options": ["`df[col].fillna(..., inplace=True)` is chained assignment: it modifies a temporary copy, so the DataFrame is unchanged; assign back instead", "The median is NaN", "`fillna` cannot fill float columns", "`copy()` makes the DataFrame read-only"], "type": "mcq", "answer": 0}, {"id": "cl-05", "topic": "clean", "q": "Complete the code that creates an imputer which fills missing values with the median.", "exp": "`SimpleImputer` лежит в `sklearn.impute`. Стратегия задаётся параметром `strategy`: `\"mean\"`, `\"median\"`, `\"most_frequent\"`, `\"constant\"`.", "code": "from sklearn.⟦impute⟧ import SimpleImputer\n\nimputer = SimpleImputer(⟦strategy⟧=\"⟦median⟧\")", "type": "fill"}, {"id": "cl-06", "topic": "clean", "q": "Complete the code that keeps
